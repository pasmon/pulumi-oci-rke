name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint, Syntax Check & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --locked

      - name: Syntax check
        run: uv run python -m py_compile __main__.py tests/*.py

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Format check with Black
        run: uv run black --check .

      - name: Lint with Pylint
        run: uv run pylint __main__.py tests

      - name: Security check with Bandit
        run: uv run bandit -c pyproject.toml -r . -x ./tests -x ./.venv

      - name: Run Unit Tests
        run: uv run pytest -v
